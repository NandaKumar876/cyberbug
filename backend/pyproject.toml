[project]
name = "cyberbug"
version = "0.1.0"
description = "AI-based cybersecurity system for detecting cyber threats in unidirectional IP traffic"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "numpy>=2.1.0",
  "scikit-learn>=1.5.0",
  "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]
postgres = ["psycopg[binary]>=3.2.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
